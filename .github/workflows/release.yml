name: Build and publish Dear Diary test release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build universal Android debug APK with development account config
        env:
          DD_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DD_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DD_SUPABASE_URL" || (echo "Set repository Actions variable SUPABASE_URL" && exit 1)
          test -n "$DD_SUPABASE_ANON_KEY" || (echo "Set repository Actions variable SUPABASE_ANON_KEY" && exit 1)
          flutter build apk --debug --dart-define="SUPABASE_URL=$DD_SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$DD_SUPABASE_ANON_KEY" --dart-define=USERNAME_ONLY_AUTH=true
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app with development account config
        env:
          DD_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DD_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DD_SUPABASE_URL" || (echo "Set repository Actions variable SUPABASE_URL" && exit 1)
          test -n "$DD_SUPABASE_ANON_KEY" || (echo "Set repository Actions variable SUPABASE_ANON_KEY" && exit 1)
          flutter build ios --release --no-codesign --dart-define="SUPABASE_URL=$DD_SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$DD_SUPABASE_ANON_KEY" --dart-define=USERNAME_ONLY_AUTH=true
      - name: Package unsigned iOS IPA
        run: |
          mkdir -p build/ios/package/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          (cd build/ios/package && /usr/bin/zip -qry ../dear-diary-ios-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/dear-diary-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish test release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: dist/ios
      - uses: softprops/action-gh-release@v2
        with:
          name: Dear Diary ${{ github.ref_name }} (prototype)
          prerelease: true
          generate_release_notes: true
          body: |
            A universal Android debug APK and an unsigned iOS IPA are attached.

            **iPhone test:** the IPA is not signed. It cannot be opened directly on an iPhone. On Windows, you can use the official AltServer/AltStore workflow to sign and sideload it with your Apple Account. Free sideloaded builds expire after 7 days and need refreshing. Never share your Apple Account password with anyone; enter it only into software you have chosen to trust.

            **Prototype only:** this build is not a secure or production messaging app. Demo PINs and diary/chat data are stored unencrypted locally. Do not use real or sensitive data.
          files: |
            dist/android/*.apk
            dist/ios/*.ipa
